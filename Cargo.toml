[package]
name = "comet"
version = "0.5.0"
edition = "2021"
authors = ["Pink Pixel <admin@pinkpixel.dev>"]
description = "A colorful, animated system monitor for the terminal built with Rust and Ratatui"
license = "Apache-2.0"
repository = "https://github.com/pinkpixel-dev/comet"

[dependencies]
ratatui = { version = "0.30.2", features = ["all-widgets", "crossterm"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
sysinfo = "0.39.6"
nvml-wrapper = "0.13.0"
anyhow = "1.0"
unicode-width = "0.2"
crossbeam-channel = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
libc = "0.2"
